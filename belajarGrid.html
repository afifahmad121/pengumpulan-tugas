    <html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>

  <style>
    html,
    body {
      margin: 20px;
      padding: 0;
      font-family: arial;
      color: white;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .item {
      background-color: #bada55;
      padding: 20px;
      margin: 5px;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: .5s;
    }

    .item:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
    
  </div>
</body>

</html>
</body>
</html>
